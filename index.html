<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>파이썬 첫걸음 — 기초 문법 연습</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F6; --panel:#FFFFFF; --panel-2:#F6F8FB; --ink:#1D2B4F; --ink-2:#55627F; --line:#D9DFEA;
  --blue:#3463C9; --blue-ink:#FFFFFF; --blue-soft:#E4ECFB; --yellow:#F6D04D; --yellow-soft:#FCF1C4;
  --ok:#1F8A5B; --ok-soft:#DDF2E7; --bad:#C2412D; --bad-soft:#F9E1DC;
  --code-bg:#FBFCFE; --gutter:#F0F3F8; --gutter-ink:#9AA5BC;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,"D2Coding",monospace;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10141D; --panel:#181E2B; --panel-2:#1D2434; --ink:#E6EAF2; --ink-2:#9AA6BE; --line:#2B3448;
    --blue:#7FA2F0; --blue-ink:#10141D; --blue-soft:#22304F; --yellow:#E9C548; --yellow-soft:#3A3420;
    --ok:#5CC793; --ok-soft:#183427; --bad:#F08A76; --bad-soft:#3A201C;
    --code-bg:#141A26; --gutter:#161C29; --gutter-ink:#5D6880; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10141D; --panel:#181E2B; --panel-2:#1D2434; --ink:#E6EAF2; --ink-2:#9AA6BE; --line:#2B3448;
  --blue:#7FA2F0; --blue-ink:#10141D; --blue-soft:#22304F; --yellow:#E9C548; --yellow-soft:#3A3420;
  --ok:#5CC793; --ok-soft:#183427; --bad:#F08A76; --bad-soft:#3A201C;
  --code-bg:#141A26; --gutter:#161C29; --gutter-ink:#5D6880; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
code,pre,textarea.code{font-family:var(--mono)}

.app{height:100%;display:grid;grid-template-rows:auto 1fr;min-height:0}
.topbar{display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.brand h1 .dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--yellow);margin-right:7px;box-shadow:6px 0 0 var(--blue);margin-right:14px;vertical-align:1px}
.brand span{color:var(--ink-2);font-size:13px;white-space:nowrap}
.progress{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-2)}
.bar{width:140px;height:8px;border-radius:4px;background:var(--panel-2);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.menu-btn{display:none;border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:5px 10px;font-size:13px}

.main{display:grid;grid-template-columns:250px minmax(0,1fr) minmax(0,1.25fr);min-height:0}
/* sidebar */
.side{border-right:1px solid var(--line);background:var(--panel);overflow:auto;padding:10px 0 24px}
.unit{padding:4px 0}
.unit-head{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;background:none;padding:8px 16px;text-align:left;font-weight:600;font-size:14px}
.unit-head small{color:var(--ink-2);font-weight:500;font-size:12px}
.plist{list-style:none;margin:0;padding:0}
.plist button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:6px 16px 6px 22px;font-size:14px;color:var(--ink-2)}
.plist button:hover{background:var(--panel-2);color:var(--ink)}
.plist button[aria-current="true"]{color:var(--ink);background:var(--blue-soft);font-weight:600}
.plist .num{font-family:var(--mono);font-size:12px;min-width:26px;color:var(--ink-2)}
.mark{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line);flex:none;display:grid;place-items:center;font-size:10px;line-height:1}
.mark.solved{background:var(--ok);border-color:var(--ok);color:var(--panel)}
.mark.tried{border-color:var(--yellow);background:var(--yellow-soft)}

/* problem pane */
.prob{overflow:auto;padding:22px 26px 40px;border-right:1px solid var(--line)}
.crumb{font-size:13px;color:var(--ink-2);margin:0 0 6px}
.ptitle{display:flex;align-items:baseline;gap:12px;margin:0 0 16px}
.ptitle .big{font-family:var(--mono);font-weight:600;font-size:15px;color:var(--blue);background:var(--blue-soft);padding:2px 8px;border-radius:6px}
.ptitle h2{font-size:22px;margin:0;letter-spacing:-.01em;line-height:1.35}
.prob h3{font-size:14px;margin:22px 0 6px;color:var(--ink)}
.prob p{margin:0 0 8px;max-width:62ch}
.prob code{background:var(--panel-2);border:1px solid var(--line);border-radius:4px;padding:0 4px;font-size:.9em}
.examples{display:grid;gap:10px}
.ex{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.ex div{padding:8px 12px;min-width:0}
.ex div+div{border-left:1px solid var(--line)}
.ex b{display:block;font-size:12px;color:var(--ink-2);font-weight:500;margin-bottom:2px}
.ex pre{margin:0;font-size:13px;white-space:pre-wrap;word-break:break-all}
.ex .none{color:var(--ink-2);font-family:var(--sans);font-size:13px}
.helpers{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;font-size:13px}
.chip:hover{border-color:var(--blue);color:var(--blue)}
.reveal{margin-top:12px;border-left:3px solid var(--yellow);background:var(--panel);padding:10px 14px;border-radius:0 8px 8px 0}
.reveal pre{background:var(--code-bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:13px;overflow-x:auto;margin:8px 0 0}
.reveal[hidden]{display:none}

/* workspace */
.work{display:grid;grid-template-rows:auto minmax(180px,1fr) auto minmax(200px,.9fr);min-height:0;background:var(--panel)}
.toolbar{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.toolbar .label{font-size:13px;color:var(--ink-2);margin-right:auto}
.btn{border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:6px 14px;font-size:14px;font-weight:500}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--blue);color:var(--blue-ink);border-color:var(--blue)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ai{background:var(--yellow);border-color:var(--yellow);color:#1D2B4F}
.btn:disabled{opacity:.5;cursor:default}
.kbd{font-size:11px;color:var(--ink-2);font-family:var(--mono)}

.editor{display:grid;grid-template-columns:auto 1fr;min-height:0;background:var(--code-bg);position:relative}
.gutter{overflow:hidden;background:var(--gutter);color:var(--gutter-ink);font-family:var(--mono);font-size:14px;line-height:22px;padding:12px 0;text-align:right;user-select:none;border-right:1px solid var(--line)}
.gutter div{padding:0 10px 0 14px;min-width:44px}
.gutter div.err{background:var(--bad-soft);color:var(--bad);font-weight:600}
textarea.code{border:0;resize:none;outline:none;background:transparent;font-size:14px;line-height:22px;padding:12px 14px;white-space:pre;overflow:auto;tab-size:4;min-height:0;height:100%;width:100%}
textarea.code:focus-visible{outline:none;box-shadow:inset 0 0 0 2px var(--blue-soft)}

.stdin{border-top:1px solid var(--line);padding:8px 14px;display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;background:var(--panel-2)}
.stdin label{font-size:13px;color:var(--ink-2);padding-top:5px}
.stdin textarea{font-family:var(--mono);font-size:13px;line-height:19px;border:1px solid var(--line);border-radius:6px;background:var(--code-bg);padding:5px 8px;resize:vertical;min-height:32px;height:46px;width:100%}

.out{border-top:1px solid var(--line);display:grid;grid-template-rows:auto 1fr;min-height:0}
.tabs{display:flex;gap:2px;padding:0 10px;border-bottom:1px solid var(--line);background:var(--panel)}
.tab{border:0;background:none;padding:9px 12px;font-size:14px;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:6px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--blue);font-weight:600}
.tab .badge{font-size:11px;padding:0 6px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line);font-weight:500}
.tab .badge.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.tab .badge.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.panel{overflow:auto;padding:14px 16px 24px;min-height:0}
.panel[hidden]{display:none}
.empty{color:var(--ink-2);font-size:14px}
.console{font-family:var(--mono);font-size:13.5px;white-space:pre-wrap;word-break:break-word;margin:0;line-height:1.55}
.errbox{margin-top:10px;border:1px solid var(--bad);background:var(--bad-soft);border-radius:8px;padding:10px 12px}
.errbox .raw{font-family:var(--mono);font-size:13px;color:var(--bad);margin:0 0 6px;word-break:break-word}
.errbox p{margin:0;font-size:14px}
.verdict{display:flex;align-items:center;gap:12px;margin-bottom:12px;padding:12px 14px;border-radius:10px}
.verdict.ok{background:var(--ok-soft);color:var(--ok)}
.verdict.bad{background:var(--bad-soft);color:var(--bad)}
.verdict strong{font-size:17px}
.verdict span{color:var(--ink);font-size:14px}
.tcase{border:1px solid var(--line);border-radius:8px;margin-bottom:8px;overflow:hidden}
.tcase summary{list-style:none;cursor:pointer;padding:8px 12px;display:flex;align-items:center;gap:10px;font-size:14px}
.tcase summary::-webkit-details-marker{display:none}
.tcase .st{font-weight:600}
.tcase .st.ok{color:var(--ok)} .tcase .st.bad{color:var(--bad)}
.tgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line)}
.tgrid div{padding:8px 12px;min-width:0}
.tgrid div+div{border-left:1px solid var(--line)}
.tgrid b{display:block;font-size:12px;color:var(--ink-2);font-weight:500}
.tgrid pre{margin:0;font-size:13px;white-space:pre-wrap;word-break:break-all}
.tgrid .diff{background:var(--bad-soft)}

.ai-intro{font-size:14px;color:var(--ink-2);margin:0 0 12px}
.ai-msg{font-size:14.5px;line-height:1.7}
.ai-msg h4{font-size:14.5px;margin:14px 0 4px;display:inline-block;background:linear-gradient(transparent 55%,var(--yellow-soft) 55%)}
.ai-msg h4:first-child{margin-top:0}
.ai-msg p{margin:0 0 8px}
.ai-msg ul,.ai-msg ol{margin:0 0 8px;padding-left:22px}
.ai-msg code{background:var(--panel-2);border:1px solid var(--line);border-radius:4px;padding:0 4px;font-size:.88em}
.ai-msg pre{background:var(--code-bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow-x:auto;font-size:13px;margin:6px 0 10px}
.ai-msg pre code{background:none;border:0;padding:0}
.q-bubble{margin:16px 0 8px;margin-left:auto;max-width:85%;background:var(--blue-soft);padding:8px 12px;border-radius:12px 12px 2px 12px;font-size:14px;width:fit-content}
.thinking{color:var(--ink-2);font-size:14px;display:flex;align-items:center;gap:8px}
.thinking::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--yellow);animation:pulse 1s infinite alternate}
@keyframes pulse{to{opacity:.25}}
@media (prefers-reduced-motion:reduce){.thinking::before{animation:none}.bar i{transition:none}}
.ask{display:flex;gap:8px;margin-top:14px}
.ask input{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--panel-2)}
.ai-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.me{border:1px dashed var(--line);background:none;border-radius:8px;padding:5px 10px;font-size:13px;color:var(--ink-2);font-family:var(--mono);white-space:nowrap}
.me.on{border-style:solid;color:var(--ink);background:var(--panel-2)}
.solved-note{color:var(--ok);font-weight:600;font-size:14px;margin:-6px 0 14px}
.tried-note{color:var(--ink-2);font-size:14px;margin:-6px 0 14px}

.overlay{position:fixed;inset:0;z-index:40;background:rgba(12,16,26,.45);display:grid;place-items:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.overlay[hidden]{display:none}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.25);width:100%;max-height:100%;overflow:auto}
.sheet.small{max-width:420px;padding:26px 24px 22px}
.sheet.wide{max-width:920px;padding:0 0 24px}
.sheet h2{margin:0 0 6px;font-size:20px;letter-spacing:-.01em}
.sheet .sub{color:var(--ink-2);font-size:14px;margin:0 0 16px}
.code-input{width:100%;font-family:var(--mono);font-size:24px;letter-spacing:.12em;text-align:center;text-transform:uppercase;padding:10px;border:1.5px solid var(--line);border-radius:10px;background:var(--code-bg)}
.code-input:focus{outline:none;border-color:var(--blue)}
.msg{min-height:22px;margin:6px 0 8px;font-size:13.5px;color:var(--bad)}
.btn.wide{width:100%;padding:10px}
.login-alt{margin-top:14px;text-align:center;font-size:13.5px;color:var(--ink-2)}
.linkish{border:0;background:none;color:var(--blue);text-decoration:underline;padding:2px;font-size:13.5px}

.sheet-head{position:sticky;top:0;display:flex;align-items:center;gap:10px;padding:18px 24px 14px;background:var(--panel);border-bottom:1px solid var(--line);z-index:1}
.sheet-head h2{margin:0}
.code-tag{font-family:var(--mono);font-size:13px;padding:2px 8px;border-radius:6px;background:var(--panel-2);border:1px solid var(--line);color:var(--ink-2)}
.x{margin-left:auto;border:0;background:none;font-size:18px;color:var(--ink-2);padding:4px 8px;border-radius:6px}
.x:hover{background:var(--panel-2)}
#recBody{padding:18px 24px 0}
.finish{position:relative;overflow:hidden;border-radius:14px;padding:24px 24px 22px;margin-bottom:18px;background:var(--ok-soft);border:1.5px solid var(--ok)}
.finish .big-check{width:48px;height:48px;border-radius:50%;background:var(--ok);color:var(--panel);display:grid;place-items:center;font-size:26px;font-weight:700;margin-bottom:10px}
.finish h3{margin:0 0 4px;font-size:22px;color:var(--ink)}
.finish p{margin:0;color:var(--ink-2);font-size:14.5px}
.finish .stamp{position:absolute;right:20px;top:18px;font-family:var(--mono);font-size:12px;color:var(--ok);border:1.5px solid var(--ok);border-radius:6px;padding:3px 8px;transform:rotate(4deg)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:20px}
.stat{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--panel-2)}
.stat b{display:block;font-size:24px;line-height:1.2;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--ink-2)}
.sbar{height:6px;border-radius:3px;background:var(--panel);border:1px solid var(--line);overflow:hidden;margin-top:8px}
.sbar i{display:block;height:100%;background:var(--ok)}
.unit-block{margin-bottom:16px}
.unit-block h4{margin:0 0 6px;font-size:14px;display:flex;justify-content:space-between}
.unit-block h4 small{color:var(--ink-2);font-weight:500}
.rtable{width:100%;border-collapse:collapse;font-size:14px}
.rtable td{padding:7px 8px;border-top:1px solid var(--line);vertical-align:middle;word-break:keep-all}
.rtable tr{cursor:pointer}
.rtable tr:hover td{background:var(--panel-2)}
.rtable .n{font-family:var(--mono);font-size:12px;color:var(--ink-2);width:34px}
.rtable .st{width:84px;font-weight:600;font-size:13px}
.rtable .st.solved{color:var(--ok)} .rtable .st.tried{color:#B7791F} .rtable .st.none{color:var(--ink-2);font-weight:400}
.rtable .tries{width:120px;text-align:right;font-variant-numeric:tabular-nums}
.rtable .when{width:110px;text-align:right;color:var(--ink-2);font-size:13px}
.dots{display:inline-flex;gap:3px;vertical-align:middle;margin-right:6px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--bad);opacity:.55}
.dots i.ok{background:var(--ok);opacity:1}
.rec-foot{color:var(--ink-2);font-size:13px;margin:8px 0 0}
@media (max-width:760px){
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .rtable .when{display:none}
  .rtable td{padding:7px 4px}
  .rtable .st{width:56px}
  .rtable .tries{width:84px}
  .rtable .dots{display:none}
  #recBody{padding:16px 16px 0}
  .sheet-head{padding:16px}
  .me{max-width:110px;overflow:hidden;text-overflow:ellipsis}
  #recBtn{padding:5px 10px;font-size:13px}
}
@media print{.overlay{position:static;background:none;padding:0}.sheet{box-shadow:none;border:0;max-height:none}.app,.toast,.x{display:none}}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:8px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
.toast.show{opacity:1}
.loading{position:absolute;inset:0;display:grid;place-items:center;background:var(--code-bg);color:var(--ink-2);font-size:14px;z-index:2}
.loading[hidden]{display:none}

@media (max-width:1100px){
  .main{grid-template-columns:minmax(0,1fr) minmax(0,1.2fr)}
  .menu-btn{display:inline-block}
  .side{position:fixed;top:0;bottom:0;left:0;width:min(300px,85vw);z-index:20;transform:translateX(-102%);transition:transform .2s;padding-top:calc(14px + env(safe-area-inset-top,0px));box-shadow:0 0 0 100vmax rgba(0,0,0,0);}
  .side.open{transform:none;box-shadow:0 0 0 100vmax rgba(10,14,24,.4)}
}
@media (max-width:760px){
  html,body{height:auto}
  .app{height:auto;display:block}
  .main{display:block}
  .prob{border-right:0;padding:18px 16px 20px;overflow:visible}
  .work{display:block;border-top:1px solid var(--line)}
  .editor{height:320px}
  .out .panel{max-height:none;overflow:visible}
  .brand span,.bar{display:none}
  .tgrid{grid-template-columns:1fr}
  .tgrid div+div{border-left:0;border-top:1px solid var(--line)}
  .ex{grid-template-columns:1fr}
  .ex div+div{border-left:0;border-top:1px solid var(--line)}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <button class="menu-btn" id="menuBtn" aria-controls="side" aria-expanded="false">문제 목록</button>
    <div class="brand"><h1><span class="dot" aria-hidden="true"></span>파이썬 첫걸음</h1><span>혼자 해보는 기초 문법 연습</span></div>
    <div class="progress"><span id="progText">0 / 0 해결</span><div class="bar" aria-hidden="true"><i id="progBar"></i></div></div>
    <button class="me" id="meBtn" title="학습 코드"></button>
    <button class="btn" id="recBtn">나의 기록</button>
  </header>

  <div class="main">
    <nav class="side" id="side" aria-label="단원별 문제"></nav>

    <section class="prob" id="prob" aria-live="polite"></section>

    <section class="work" aria-label="코드 작성과 실행">
      <div class="toolbar">
        <span class="label">main.py</span>
        <button class="btn" id="resetBtn" title="처음 코드로 되돌리기">초기화</button>
        <button class="btn" id="runBtn" title="Ctrl+Enter">실행 <span class="kbd">⌃↵</span></button>
        <button class="btn primary" id="submitBtn">제출하고 채점</button>
      </div>
      <div class="editor">
        <div class="gutter" id="gutter" aria-hidden="true"></div>
        <textarea class="code" id="code" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" aria-label="파이썬 코드"></textarea>
        <div class="loading" id="loading">파이썬 실행기를 불러오는 중…</div>
      </div>
      <div class="stdin">
        <label for="stdin">실행할 때 넣을 입력</label>
        <textarea id="stdin" spellcheck="false" placeholder="input()으로 받을 값을 한 줄에 하나씩 적어요"></textarea>
      </div>
      <div class="out">
        <div class="tabs" role="tablist">
          <button class="tab" role="tab" id="tab-run" aria-selected="true" aria-controls="panel-run">실행 결과</button>
          <button class="tab" role="tab" id="tab-judge" aria-selected="false" aria-controls="panel-judge">채점 결과 <span class="badge" id="judgeBadge" hidden></span></button>
          <button class="tab" role="tab" id="tab-ai" aria-selected="false" aria-controls="panel-ai">AI 피드백</button>
        </div>
        <div class="panel" role="tabpanel" id="panel-run"><p class="empty">코드를 쓰고 <strong>실행</strong>을 누르면 출력이 여기에 나와요.</p></div>
        <div class="panel" role="tabpanel" id="panel-judge" hidden><p class="empty"><strong>제출하고 채점</strong>을 누르면 여러 테스트로 코드를 확인해요.</p></div>
        <div class="panel" role="tabpanel" id="panel-ai" hidden></div>
      </div>
    </section>
  </div>
</div>
<div class="overlay" id="login" hidden>
  <div class="sheet small" role="dialog" aria-modal="true" aria-labelledby="loginTitle">
    <h2 id="loginTitle">학습 코드를 입력하세요</h2>
    <p class="sub" id="loginSub">선생님께 받은 코드를 넣으면 문제마다 몇 번 만에 풀었는지 기록돼요. 이름이나 학번은 받지 않아요.</p>
    <input id="codeInput" class="code-input" placeholder="K7M-29Q" maxlength="9" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="학습 코드">
    <p class="msg" id="loginMsg" role="alert"></p>
    <button class="btn primary wide" id="loginBtn">시작하기</button>
    <div class="login-alt" id="loginAlt"></div>
  </div>
</div>

<div class="overlay" id="record" hidden>
  <div class="sheet wide" role="dialog" aria-modal="true" aria-labelledby="recTitle">
    <div class="sheet-head"><h2 id="recTitle">나의 기록</h2><span class="code-tag" id="recCode"></span><button class="x" id="recClose" aria-label="닫기">✕</button></div>
    <div id="recBody"></div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="problems.js"></script>
<script>
/* ---------------- 상태 저장 ---------------- */
const KEY = "pyfirst:v1";
let store = {code:{}, last:"p1", tried:{}, recs:{}, pending:{}, session:null, guest:false};
try { const raw = localStorage.getItem(KEY); if (raw) store = Object.assign(store, JSON.parse(raw)); } catch (e) {}
["tried","recs","pending"].forEach(k=>{ if(!store[k]||typeof store[k]!=="object") store[k]={}; });
function save(){ try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }

/* 기록: 학습 코드별로 따로 보관. rec = {a: 제출 횟수, s: 해결 시각, f: 처음 통과한 시도 번호} */
const profile = () => store.session || "local";
function recs(){ return store.recs[profile()] || (store.recs[profile()] = {}); }
function statusOf(id){
  const r = recs()[id];
  if (r && r.s) return "solved";
  if ((r && r.a > 0) || store.tried[id]) return "tried";
  return "";
}
function recordLocal(id, passed){
  const r = recs()[id] || {a:0, s:null, f:null};
  if (r.s) return r;
  r.a += 1;
  if (passed){ r.s = Date.now(); r.f = r.a; }
  recs()[id] = r; return r;
}

/* ---------------- 유틸 ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),1800); }
const norm = s => String(s).replace(/\r/g,"").split("\n").map(l=>l.replace(/\s+$/,"")).join("\n").replace(/\n+$/,"");

let cur = PROBLEMS.find(p => p.id === store.last) || PROBLEMS[0];
const fromHash = (location.hash||"").slice(1);
if (PROBLEMS.some(p=>p.id===fromHash)) cur = PROBLEMS.find(p=>p.id===fromHash);
let lastRun = null;      // {kind:"run"|"judge", ...}
let aiTurns = [];        // 현재 문제의 AI 대화
let aiBusy = null;

/* ---------------- 사이드바 ---------------- */
function renderSide(){
  const side = $("#side");
  side.innerHTML = UNITS.map((u,ui)=>{
    const ps = PROBLEMS.filter(p=>p.u===ui);
    const done = ps.filter(p=>statusOf(p.id)==="solved").length;
    return `<div class="unit"><div class="unit-head">${ui+1}. ${esc(u.name)} <small>${done}/${ps.length}</small></div>
      <ul class="plist">${ps.map(p=>{
        const st = statusOf(p.id);
        return `<li><button data-id="${p.id}" aria-current="${p.id===cur.id}"><span class="mark ${st}" aria-label="${st==="solved"?"해결":st==="tried"?"시도함":"안 풂"}">${st==="solved"?"✓":""}</span><span class="num">${p.id.slice(1)}</span>${esc(p.title)}</button></li>`;
      }).join("")}</ul></div>`;
  }).join("");
  const solved = PROBLEMS.filter(p=>statusOf(p.id)==="solved").length;
  $("#progText").textContent = `${solved} / ${PROBLEMS.length} 해결`;
  $("#progBar").style.width = (solved/PROBLEMS.length*100)+"%";
}
$("#side").addEventListener("click", e=>{
  const b = e.target.closest("button[data-id]"); if(!b) return;
  select(b.dataset.id); closeMenu();
});
$("#menuBtn").addEventListener("click", ()=>{
  const open = !$("#side").classList.contains("open");
  $("#side").classList.toggle("open", open); $("#menuBtn").setAttribute("aria-expanded", open);
});
function closeMenu(){ $("#side").classList.remove("open"); $("#menuBtn").setAttribute("aria-expanded","false"); }
document.addEventListener("click", e=>{
  if ($("#side").classList.contains("open") && !e.target.closest("#side") && !e.target.closest("#menuBtn")) closeMenu();
});

/* ---------------- 문제 화면 ---------------- */
function renderProblem(){
  const p = cur, u = UNITS[p.u];
  const exs = p.tests.filter(t=>t.ex);
  const rc = recs()[p.id]; const solvedHere = statusOf(p.id)==="solved"; const fails = rc && !rc.s ? rc.a : 0;
  $("#prob").innerHTML = `
    <p class="crumb">${p.u+1}단원 · ${esc(u.name)}</p>
    <div class="ptitle"><span class="big">${p.id.slice(1).padStart(2,"0")}</span><h2>${esc(p.title)}</h2></div>
    ${solvedHere?`<p class="solved-note">✓ ${rc.f===1?"한 번에":rc.f+"번 만에"} 해결했어요</p>`:rc&&rc.a?`<p class="tried-note">지금까지 ${rc.a}번 제출했어요</p>`:""}
    <p>${p.desc}</p>
    <h3>입력</h3><p>${p.inF}</p>
    <h3>출력</h3><p>${p.outF}</p>
    <h3>예시</h3>
    <div class="examples">${exs.map(t=>`<div class="ex"><div><b>입력</b>${t.in?`<pre>${esc(t.in)}</pre>`:`<span class="none">없음</span>`}</div><div><b>출력</b><pre>${esc(t.out)}</pre></div></div>`).join("")}</div>
    <div class="helpers">
      <button class="chip" data-r="concept">개념 다시 보기</button>
      <button class="chip" data-r="hint">힌트 보기</button>
      ${fails>=3||solvedHere?`<button class="chip" data-r="sol">모범 답안 보기</button>`:""}
    </div>
    <div class="reveal" id="r-concept" hidden><strong>${esc(u.name)}</strong><p style="margin-top:4px">${u.concept}</p><pre>${esc(u.ex)}</pre></div>
    <div class="reveal" id="r-hint" hidden>${esc(p.hint)}</div>
    <div class="reveal" id="r-sol" hidden>먼저 스스로 끝까지 해 보고 비교해 보세요.<pre>${esc(p.sol)}</pre></div>
    ${fails>0&&fails<3&&!solvedHere?`<p class="empty" style="margin-top:14px">3번 틀리면 모범 답안을 볼 수 있어요. (지금 ${fails}번)</p>`:""}
  `;
  $("#prob").scrollTop = 0;
}
$("#prob").addEventListener("click", e=>{
  const b = e.target.closest("[data-r]"); if(!b) return;
  const box = $("#r-"+b.dataset.r); box.hidden = !box.hidden;
});

function select(id){
  store.code[cur.id] = $("#code").value; 
  cur = PROBLEMS.find(p=>p.id===id); store.last = id; save();
  try { history.replaceState(null,"","#"+id); } catch(e){}
  lastRun = null; aiTurns = []; if (aiBusy) { aiBusy.abort(); aiBusy=null; }
  renderSide(); renderProblem(); loadEditor();
  $("#panel-run").innerHTML = `<p class="empty">코드를 쓰고 <strong>실행</strong>을 누르면 출력이 여기에 나와요.</p>`;
  $("#panel-judge").innerHTML = `<p class="empty"><strong>제출하고 채점</strong>을 누르면 여러 테스트로 코드를 확인해요.</p>`;
  $("#judgeBadge").hidden = true;
  renderAI(); showTab("run");
}

/* ---------------- 에디터 ---------------- */
const code = $("#code"), gutter = $("#gutter");
function loadEditor(){
  code.value = store.code[cur.id] ?? cur.starter;
  const ex = cur.tests.find(t=>t.ex);
  $("#stdin").value = ex ? ex.in : "";
  updateGutter();
}
function updateGutter(errLine){
  const n = code.value.split("\n").length;
  let h = ""; for (let i=1;i<=n;i++) h += `<div${i===errLine?' class="err"':""}>${i}</div>`;
  gutter.innerHTML = h; gutter.scrollTop = code.scrollTop;
}
code.addEventListener("scroll", ()=>{ gutter.scrollTop = code.scrollTop; });
code.addEventListener("input", ()=>{ updateGutter(); store.code[cur.id]=code.value; clearTimeout(code._s); code._s=setTimeout(save,400); });
code.addEventListener("keydown", e=>{
  const s = code.selectionStart, en = code.selectionEnd, v = code.value;
  if ((e.ctrlKey||e.metaKey) && e.key==="Enter"){ e.preventDefault(); runCode(); return; }
  if (e.key==="Tab" && !e.shiftKey){ e.preventDefault(); insert("    "); return; }
  if (e.key==="Tab" && e.shiftKey){
    e.preventDefault();
    const ls = v.lastIndexOf("\n", s-1)+1;
    const m = v.slice(ls).match(/^ {1,4}/);
    if (m){ code.setRangeText("", ls, ls+m[0].length, "end"); code.selectionStart=code.selectionEnd=Math.max(ls, s-m[0].length); code.dispatchEvent(new Event("input")); }
    return;
  }
  if (e.key==="Enter" && !e.isComposing){
    e.preventDefault();
    const ls = v.lastIndexOf("\n", s-1)+1;
    const line = v.slice(ls, s);
    let ind = (line.match(/^\s*/)||[""])[0];
    if (/:\s*$/.test(line)) ind += "    ";
    insert("\n"+ind);
  }
  function insert(t){ code.setRangeText(t, s, en, "end"); code.dispatchEvent(new Event("input")); }
});
$("#resetBtn").addEventListener("click", ()=>{
  if (!confirm("작성한 코드를 지우고 처음 코드로 되돌릴까요?")) return;
  code.value = cur.starter; store.code[cur.id]=code.value; save(); updateGutter(); toast("처음 코드로 되돌렸어요");
});

/* ---------------- 파이썬 실행 (Skulpt) ---------------- */
let skReady = false;
function initSk(){
  if (window.Sk && Sk.builtinFiles){ skReady = true; $("#loading").hidden = true; }
  else { $("#loading").textContent = "파이썬 실행기를 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요."; }
}
function runPython(src, input){
  return new Promise(resolve=>{
    let out = ""; const lines = String(input).replace(/\r/g,"").split("\n"); let i = 0;
    Sk.configure({
      output: t => { out += t; },
      read: x => { if (!Sk.builtinFiles || Sk.builtinFiles.files[x] === undefined) throw "File not found: '" + x + "'"; return Sk.builtinFiles.files[x]; },
      inputfun: () => { if (i >= lines.length || (i === lines.length-1 && lines[i]==="" && i>0)) { throw new Sk.builtin.RuntimeError("EOFError: 더 읽을 입력이 없어요"); } return lines[i++]; },
      inputfunTakesPrompt: true,
      __future__: Sk.python3,
      execLimit: 3000
    });
    const t0 = performance.now();
    Sk.misceval.asyncToPromise(()=>Sk.importMainWithBody("<stdin>", false, src, true))
      .then(()=>resolve({out, err:null, ms:performance.now()-t0}))
      .catch(e=>resolve({out, err: e.toString ? e.toString() : String(e), ms:performance.now()-t0}));
  });
}
function explainError(raw){
  const m = raw.match(/on line (\d+)/); const line = m ? +m[1] : null;
  const type = (raw.match(/^(\w+):/)||[])[1] || "";
  const at = line ? `${line}번째 줄` : "코드";
  const map = {
    SyntaxError: /bad input|indent/i.test(raw) ? `${at} 근처의 문법이나 들여쓰기가 맞지 않아요. 콜론(:) 다음 줄은 빈칸 4개만큼 들여써야 하고, 같은 덩어리는 들여쓰기가 똑같아야 해요. 괄호와 따옴표 짝도 확인해 보세요.` : `${at}의 문법이 파이썬 규칙에 맞지 않아요. 괄호·따옴표 짝, 콜론(:) 빠짐, 오타를 확인해 보세요.`,
    IndentationError: `${at}의 들여쓰기가 맞지 않아요. 같은 덩어리 안의 줄은 들여쓰기 칸 수가 같아야 해요.`,
    NameError: `${at}에서 아직 만들지 않은 이름을 썼어요. 변수 이름 오타인지, 글자에 따옴표를 빠뜨렸는지 확인해 보세요.`,
    TypeError: `${at}에서 서로 맞지 않는 자료형을 함께 썼어요. 예를 들어 문자열과 숫자는 바로 더할 수 없어요. input()으로 받은 값은 문자열이니 int()로 바꿨는지 확인해 보세요.`,
    ValueError: `${at}에서 값을 바꿀 수 없어요. int()에 숫자가 아닌 글자나 여러 개의 숫자가 한꺼번에 들어갔을 수 있어요. 입력 형식(한 줄에 몇 개인지)을 다시 보세요.`,
    IndexError: `${at}에서 리스트나 문자열의 없는 위치를 찾았어요. 위치(인덱스)는 0부터 시작하고, 길이보다 작아야 해요.`,
    ZeroDivisionError: `${at}에서 0으로 나누었어요.`,
    TimeLimitError: `실행 시간이 너무 길어요. 끝나지 않는 반복(무한 루프)이 있는지 확인해 보세요. while 조건이 언젠가 거짓이 되거나 break가 실행돼야 해요.`,
    AttributeError: `${at}에서 그 자료형에 없는 기능을 불렀어요. 점(.) 뒤의 이름 철자를 확인해 보세요.`,
    RuntimeError: /EOFError/.test(raw) ? `준비된 입력보다 input()을 더 많이 불렀어요. 입력 줄 수와 input() 횟수를 맞춰 보세요.` : `${at}에서 실행 중 문제가 생겼어요.`
  };
  return {line, text: map[type] || `${at}에서 오류가 났어요. 오류 이름을 단서로 코드를 살펴보세요.`};
}

async function runCode(){
  if (!skReady) return toast("파이썬 실행기를 아직 불러오는 중이에요");
  const btn = $("#runBtn"); btn.disabled = true;
  showTab("run"); $("#panel-run").innerHTML = `<p class="thinking">실행하는 중…</p>`;
  const r = await runPython(code.value, $("#stdin").value);
  btn.disabled = false;
  let h = r.out ? `<pre class="console">${esc(r.out)}</pre>` : (r.err ? "" : `<p class="empty">출력된 내용이 없어요. print()를 썼는지 확인해 보세요.</p>`);
  let errLine = null;
  if (r.err){ const x = explainError(r.err); errLine = x.line; h += `<div class="errbox"><p class="raw">${esc(r.err)}</p><p>${esc(x.text)}</p></div>`; }
  $("#panel-run").innerHTML = h; updateGutter(errLine);
  lastRun = {kind:"run", input:$("#stdin").value, out:r.out, err:r.err};
  if (!store.tried[cur.id]){ store.tried[cur.id] = 1; save(); renderSide(); }
}

async function submitCode(){
  if (!skReady) return toast("파이썬 실행기를 아직 불러오는 중이에요");
  const btn = $("#submitBtn"); btn.disabled = true;
  showTab("judge"); $("#panel-judge").innerHTML = `<p class="thinking">테스트 ${cur.tests.length}개를 돌리는 중…</p>`;
  const results = [];
  for (const t of cur.tests){
    const r = await runPython(code.value, t.in);
    results.push({input:t.in, expected:t.out, actual:r.out, err:r.err, ok: !r.err && norm(r.out)===norm(t.out)});
  }
  btn.disabled = false;
  const pass = results.filter(r=>r.ok).length, all = pass===results.length;
  const firstErr = results.find(r=>r.err);
  updateGutter(firstErr ? explainError(firstErr.err).line : null);
  let h = all
    ? `<div class="verdict ok"><strong>정답이에요!</strong><span>테스트 ${pass}개를 모두 통과했어요.</span></div>`
    : `<div class="verdict bad"><strong>아직이에요</strong><span>${results.length}개 중 ${pass}개 통과. 틀린 테스트를 열어 비교해 보세요.</span></div>`;
  h += results.map((r,i)=>{
    const ex = r.err ? explainError(r.err) : null;
    return `<details class="tcase"${!r.ok && results.findIndex(x=>!x.ok)===i?" open":""}>
      <summary><span class="st ${r.ok?"ok":"bad"}">${r.ok?"통과":"실패"}</span> 테스트 ${i+1}${r.err?` — ${esc((r.err.match(/^\w+/)||["오류"])[0])}`:""}</summary>
      <div class="tgrid"><div><b>입력</b><pre>${r.input?esc(r.input):"(없음)"}</pre></div><div><b>기대한 출력</b><pre>${esc(r.expected)}</pre></div><div class="${r.ok?"":"diff"}"><b>내 출력</b><pre>${r.actual?esc(r.actual):"(출력 없음)"}</pre></div></div>
      ${ex?`<div class="errbox" style="margin:0;border-radius:0;border-width:1px 0 0"><p class="raw">${esc(r.err)}</p><p>${esc(ex.text)}</p></div>`:""}
    </details>`;
  }).join("");
  h += `<div class="ai-actions" style="margin-top:12px"><button class="btn ai" id="judgeAiBtn">이 결과로 AI 피드백 받기</button></div>`;
  $("#panel-judge").innerHTML = h;
  const badge = $("#judgeBadge"); badge.hidden=false; badge.textContent = `${pass}/${results.length}`; badge.className = "badge " + (all?"ok":"bad");
  lastRun = {kind:"judge", results, pass, total:results.length};
  const wasSolved = statusOf(cur.id)==="solved";
  const rec = recordLocal(cur.id, all);
  if (store.session && !wasSolved){ (store.pending[store.session] ||= []).push({pid:cur.id, passed:all}); }
  save(); renderSide(); renderProblem();
  if (all && !wasSolved){
    toast(rec.f===1 ? "한 번에 해결! 멋져요" : `해결! ${rec.f}번 만에 풀었어요`);
    if (PROBLEMS.every(p=>statusOf(p.id)==="solved")) setTimeout(()=>openRecord(), 900);
  }
  flushPending();
  if (all){ const nx = PROBLEMS[PROBLEMS.indexOf(cur)+1]; if (nx){ $("#panel-judge .ai-actions").insertAdjacentHTML("beforeend", `<button class="btn" id="nextBtn">다음 문제: ${esc(nx.title)}</button>`); $("#nextBtn").onclick=()=>select(nx.id); } }
  $("#judgeAiBtn").onclick = ()=>{ showTab("ai"); askAI(); };
}
$("#runBtn").addEventListener("click", runCode);
$("#submitBtn").addEventListener("click", submitCode);

/* ---------------- 탭 ---------------- */
function showTab(name){
  ["run","judge","ai"].forEach(n=>{
    $("#tab-"+n).setAttribute("aria-selected", n===name);
    $("#panel-"+n).hidden = n!==name;
  });
}
document.querySelector(".tabs").addEventListener("click", e=>{ const t=e.target.closest(".tab"); if(t) showTab(t.id.slice(4)); });

/* ---------------- AI 피드백 (OpenAI, 중계 서버 경유) ---------------- */
/* AI 피드백은 같은 사이트의 /api/feedback(Vercel 함수)으로 보냅니다. API 키는 Vercel 환경 변수에만 있어요. */
const AI_ENDPOINT = "/api/feedback";
const aiOn = location.protocol.startsWith("http");

function md(src){
  const blocks = [];
  src = src.replace(/```[a-zA-Z]*\n?([\s\S]*?)```/g, (_,c)=>{ blocks.push(c.replace(/\n$/,"")); return `\u0000${blocks.length-1}\u0000`; });
  const inline = s => esc(s).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
  const out = []; let list = null;
  const flush = ()=>{ if (list){ out.push(`<${list.t}>${list.items.map(i=>`<li>${i}</li>`).join("")}</${list.t}>`); list=null; } };
  for (const raw of src.split("\n")){
    const l = raw.trimEnd(); let m;
    if ((m = l.match(/^\u0000(\d+)\u0000$/))){ flush(); out.push(`<pre><code>${esc(blocks[+m[1]])}</code></pre>`); continue; }
    if ((m = l.match(/^#{1,6}\s+(.*)/))){ flush(); out.push(`<h4>${inline(m[1])}</h4>`); continue; }
    if ((m = l.match(/^\s*[-*]\s+(.*)/))){ if(!list||list.t!=="ul"){flush(); list={t:"ul",items:[]};} list.items.push(inline(m[1])); continue; }
    if ((m = l.match(/^\s*\d+[.)]\s+(.*)/))){ if(!list||list.t!=="ol"){flush(); list={t:"ol",items:[]};} list.items.push(inline(m[1])); continue; }
    if (!l.trim()){ flush(); continue; }
    flush(); out.push(`<p>${inline(l).replace(/\u0000(\d+)\u0000/g,(_,i)=>`<code>${esc(blocks[+i])}</code>`)}</p>`);
  }
  flush(); return out.join("");
}

function resultSummary(){
  if (!lastRun) return "아직 실행하거나 채점하지 않았어요.";
  if (lastRun.kind==="run"){
    return `[직접 실행]\n입력:\n${lastRun.input||"(없음)"}\n출력:\n${lastRun.out||"(없음)"}\n${lastRun.err?"오류: "+lastRun.err:""}`;
  }
  return `[채점] ${lastRun.total}개 중 ${lastRun.pass}개 통과\n` + lastRun.results.map((r,i)=>
    `테스트 ${i+1}: ${r.ok?"통과":"실패"}\n  입력: ${JSON.stringify(r.input)}\n  기대 출력: ${JSON.stringify(r.expected)}\n  학생 출력: ${JSON.stringify(r.actual)}${r.err?"\n  오류: "+r.err:""}`).join("\n");
}
function buildContext(){
  const p = cur, strip = s => s.replace(/<[^>]+>/g,"");
  return {
    title: p.title, desc: strip(p.desc), inF: strip(p.inF), outF: strip(p.outF),
    unit: UNITS[p.u].name, code: code.value, result: resultSummary(),
    solved: !!(lastRun && lastRun.kind==="judge" && lastRun.pass===lastRun.total)
  };
}

let aiCtx = null;   // 첫 피드백을 받을 때의 문제·코드·결과
function renderAI(){
  const panel = $("#panel-ai");
  if (!aiOn){ panel.innerHTML = `<p class="empty">AI 피드백은 사이트에 배포했을 때 쓸 수 있어요. 실행과 채점은 그대로 쓸 수 있어요.</p>`; return; }
  let h = "";
  if (!aiTurns.length && !aiBusy){
    h = `<p class="ai-intro">지금 코드와 마지막 실행·채점 결과를 AI 선생님이 읽고, 정답을 바로 알려 주는 대신 스스로 고칠 수 있게 힌트를 줘요.</p>
      <div class="ai-actions"><button class="btn ai" id="aiBtn">AI 피드백 받기</button>${!lastRun?`<span class="empty">먼저 실행이나 채점을 해 보면 더 정확해요.</span>`:""}</div>`;
  } else {
    aiTurns.forEach(t=>{
      if (t.role==="user") h += `<div class="q-bubble">${esc(t.content)}</div>`;
      else h += `<div class="ai-msg">${md(t.content)}</div>`;
    });
    if (aiBusy) h += `<div class="ai-msg"><p class="thinking">AI 선생님이 코드를 읽는 중…</p></div><div class="ai-actions" style="margin-top:8px"><button class="btn" id="stopBtn">멈추기</button></div>`;
    else h += `<form class="ask" onsubmit="return false"><input id="askInput" placeholder="궁금한 점을 더 물어보세요 (예: map이 뭐예요?)" maxlength="300"><button class="btn primary" id="askBtn">질문</button></form>
      <div class="ai-actions" style="margin-top:10px"><button class="btn" id="aiAgain">코드 고친 뒤 다시 피드백 받기</button></div>`;
  }
  panel.innerHTML = h;
  const b = $("#aiBtn"); if (b) b.onclick = ()=>askAI();
  const s = $("#stopBtn"); if (s) s.onclick = ()=>aiBusy && aiBusy.abort();
  const a = $("#aiAgain"); if (a) a.onclick = ()=>{ aiTurns=[]; askAI(); };
  const f = $("#askBtn"); if (f) f.onclick = ()=>{ const q=$("#askInput").value.trim(); if(q) followUp(q); };
  const ai = $("#askInput"); if (ai) ai.addEventListener("keydown", e=>{ if(e.key==="Enter" && !e.isComposing){ e.preventDefault(); const q=ai.value.trim(); if(q) followUp(q);} });
}

async function callAI(){
  const ctl = new AbortController(); aiBusy = ctl; renderAI();
  const forProblem = cur.id;
  const timer = setTimeout(()=>ctl.abort(), 60000);
  try {
    const res = await fetch(AI_ENDPOINT, {
      method:"POST", headers:{"Content-Type":"application/json"}, signal: ctl.signal,
      body: JSON.stringify({ context: aiCtx, history: aiTurns })
    });
    const data = await res.json().catch(()=>({}));
    if (!res.ok) throw Object.assign(new Error(data.error||"error"), {status:res.status, msg:data.error});
    if (cur.id!==forProblem) return;
    aiTurns.push({role:"assistant", content:String(data.text||"").trim() || "답을 받지 못했어요. 다시 시도해 주세요."});
  } catch(e){
    if (cur.id!==forProblem) return;
    if (aiTurns.length && aiTurns[aiTurns.length-1].role==="user") aiTurns.pop();
    toast(e.name==="AbortError" ? "피드백을 멈췄어요" : e.status===429 ? "요청이 많아요. 잠시 후 다시 눌러 주세요" : (e.msg || "AI 피드백을 받지 못했어요"));
  } finally {
    clearTimeout(timer);
    if (aiBusy===ctl) aiBusy=null;
    if (cur.id===forProblem) renderAI();
  }
}
function askAI(){
  if (!aiOn || aiBusy) return;
  if (!code.value.trim()) return toast("먼저 코드를 조금이라도 써 보세요");
  aiCtx = buildContext(); aiTurns = [];
  callAI();
}
function followUp(q){
  if (!aiOn || aiBusy || !aiCtx) return;
  aiTurns.push({role:"user", content:q.slice(0,300)});
  callAI();
}

/* ---------------- 학습 코드와 기록 동기화 ---------------- */
const fmtCode = raw => { const s = String(raw||"").toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,6); return s.length>3 ? s.slice(0,3)+"-"+s.slice(3) : s; };
async function api(path, payload){
  const res = await fetch(path, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(payload)});
  const data = await res.json().catch(()=>({}));
  if (!res.ok) throw Object.assign(new Error(data.error||"요청 실패"), {status:res.status, msg:data.error});
  return data;
}
function renderMe(){
  const b = $("#meBtn");
  b.textContent = store.session ? store.session : "기록 안 함";
  b.classList.toggle("on", !!store.session);
  b.title = store.session ? "학습 코드 (눌러서 바꾸기)" : "학습 코드를 넣으면 기록이 저장돼요";
}
function openLogin(msg){
  $("#codeInput").value = "";
  $("#loginMsg").textContent = msg || "";
  $("#loginTitle").textContent = store.session ? "학습 코드" : "학습 코드를 입력하세요";
  $("#loginSub").innerHTML = store.session
    ? `지금 <b>${esc(store.session)}</b> 코드로 기록하고 있어요. 다른 코드로 바꾸려면 새 코드를 입력하세요.`
    : "선생님께 받은 코드를 넣으면 문제마다 몇 번 만에 풀었는지 기록돼요. 이름이나 학번은 받지 않아요.";
  $("#loginBtn").textContent = store.session ? "이 코드로 바꾸기" : "시작하기";
  $("#loginAlt").innerHTML = store.session
    ? `<button class="linkish" id="logoutBtn">코드 빼고 연습만 하기</button> · <button class="linkish" id="loginClose">닫기</button>`
    : `코드가 없나요? <button class="linkish" id="guestBtn">코드 없이 연습만 하기</button><br><span style="font-size:12.5px">이 경우 기록은 이 기기에만 남고 선생님께 전달되지 않아요.</span>`;
  $("#login").hidden = false;
  setTimeout(()=>$("#codeInput").focus(), 50);
  const g = $("#guestBtn"); if (g) g.onclick = ()=>{ store.guest = true; save(); closeLogin(); renderAll(); };
  const lo = $("#logoutBtn"); if (lo) lo.onclick = ()=>{ if (!confirm("코드를 빼면 이 기기에서는 기록이 저장되지 않아요. 계속할까요?")) return; store.session = null; store.guest = true; save(); closeLogin(); renderAll(); toast("코드 없이 연습해요"); };
  const lc = $("#loginClose"); if (lc) lc.onclick = closeLogin;
}
function closeLogin(){ $("#login").hidden = true; }
$("#meBtn").addEventListener("click", ()=>openLogin());
$("#codeInput").addEventListener("input", e=>{ const v = fmtCode(e.target.value); if (v !== e.target.value) e.target.value = v; });
$("#codeInput").addEventListener("keydown", e=>{ if (e.key==="Enter" && !e.isComposing){ e.preventDefault(); $("#loginBtn").click(); } });
$("#loginBtn").addEventListener("click", async ()=>{
  const code = fmtCode($("#codeInput").value);
  if (code.length !== 7){ $("#loginMsg").textContent = "코드 6글자를 모두 입력해 주세요. 예: K7M-29Q"; return; }
  $("#loginBtn").disabled = true; $("#loginMsg").textContent = "";
  const ok = await syncLogin(code, false);
  $("#loginBtn").disabled = false;
  if (ok){ closeLogin(); toast(`${code} 코드로 기록을 시작해요`); }
});

async function syncLogin(code, silent){
  try {
    const d = await api("/api/student", {action:"login", code});
    store.session = d.code; store.guest = false;
    store.recs[d.code] = d.progress || {};
    save(); renderAll();
    flushPending();
    return true;
  } catch(e){
    if (e.status === 404 || e.status === 400){
      if (silent){ store.session = null; save(); renderAll(); openLogin("저장된 코드가 더 이상 등록되어 있지 않아요. 선생님께 확인해 주세요."); }
      else $("#loginMsg").textContent = e.msg || "코드를 확인해 주세요.";
      return false;
    }
    if (silent){ renderAll(); toast("인터넷이 불안정해요. 기록은 연결되면 저장돼요"); return true; }
    $("#loginMsg").textContent = e.msg || "서버에 연결하지 못했어요. 잠시 후 다시 해 주세요.";
    return false;
  }
}

let flushing = false, retryTimer = null;
async function flushPending(){
  const code = store.session; if (!code || flushing) return;
  const q = store.pending[code]; if (!q || !q.length) return;
  flushing = true; clearTimeout(retryTimer);
  try {
    while (q.length){
      const it = q[0];
      const d = await api("/api/student", {action:"submit", code, pid:it.pid, passed:it.passed});
      if (store.session === code) store.recs[code][d.pid] = d.rec;
      q.shift(); save();
    }
  } catch(e){
    if (e.status === 404){ store.pending[code] = []; save(); }
    else retryTimer = setTimeout(flushPending, 30000);
  } finally {
    flushing = false;
    renderSide(); if (!$("#record").hidden) renderRecord();
  }
}
window.addEventListener("online", flushPending);

function renderAll(){ renderSide(); renderProblem(); renderMe(); if (!$("#record").hidden) renderRecord(); }

/* ---------------- 나의 기록 ---------------- */
const fmtDate = t => { const d = new Date(t); return `${d.getMonth()+1}월 ${d.getDate()}일`; };
function openRecord(){ renderRecord(); $("#record").hidden = false; $("#recClose").focus(); }
function closeRecord(){ $("#record").hidden = true; }
$("#recBtn").addEventListener("click", openRecord);
$("#recClose").addEventListener("click", closeRecord);
$("#record").addEventListener("click", e=>{
  if (e.target.id === "record") return closeRecord();
  const tr = e.target.closest("tr[data-id]"); if (tr){ closeRecord(); select(tr.dataset.id); }
  if (e.target.id === "printBtn") window.print();
});
document.addEventListener("keydown", e=>{ if (e.key==="Escape"){ if (!$("#record").hidden) closeRecord(); else if (!$("#login").hidden && (store.session||store.guest)) closeLogin(); } });

function renderRecord(){
  const R = recs();
  const total = PROBLEMS.length;
  const solved = PROBLEMS.filter(p=>R[p.id]&&R[p.id].s);
  const submits = PROBLEMS.reduce((n,p)=>n+((R[p.id]&&R[p.id].a)||0),0);
  const firstTry = solved.filter(p=>R[p.id].f===1).length;
  const avg = solved.length ? (solved.reduce((n,p)=>n+R[p.id].f,0)/solved.length) : 0;
  const allDone = solved.length === total;
  const lastT = solved.length ? Math.max(...solved.map(p=>R[p.id].s)) : null;
  $("#recCode").textContent = store.session || "코드 없음";
  $("#recCode").hidden = false;

  let h = "";
  if (allDone){
    h += `<div class="finish"><span class="stamp">${esc(store.session||"PRACTICE")}</span>
      <div class="big-check" aria-hidden="true">✓</div>
      <h3>파이썬 기초 ${total}문제 완주!</h3>
      <p>${fmtDate(lastT)}에 마지막 문제를 풀었어요. 모두 ${submits}번 제출했고, ${firstTry}문제는 한 번에 맞혔어요.</p>
      <div class="ai-actions" style="margin-top:14px"><button class="btn" id="printBtn">완주 기록 인쇄하기</button></div></div>`;
  }
  h += `<div class="stats">
    <div class="stat"><b>${solved.length}<small style="font-size:14px;color:var(--ink-2)"> / ${total}</small></b><span>해결한 문제</span><div class="sbar"><i style="width:${solved.length/total*100}%"></i></div></div>
    <div class="stat"><b>${submits}</b><span>전체 제출 횟수</span></div>
    <div class="stat"><b>${firstTry}</b><span>한 번에 맞힌 문제</span></div>
    <div class="stat"><b>${solved.length?avg.toFixed(1):"–"}</b><span>해결까지 평균 시도</span></div>
  </div>`;
  h += UNITS.map((u,ui)=>{
    const ps = PROBLEMS.filter(p=>p.u===ui);
    const d = ps.filter(p=>R[p.id]&&R[p.id].s).length;
    return `<div class="unit-block"><h4>${ui+1}. ${esc(u.name)} <small>${d} / ${ps.length}</small></h4>
      <table class="rtable"><tbody>${ps.map(p=>{
        const r = R[p.id]; const st = statusOf(p.id);
        const label = st==="solved" ? "해결" : st==="tried" ? "도전 중" : "아직";
        const dots = r && r.a ? `<span class="dots" aria-hidden="true">${Array.from({length:Math.min(r.a,8)},(_,i)=>`<i class="${r.s&&i===Math.min(r.a,8)-1?"ok":""}"></i>`).join("")}</span>` : "";
        const tries = r && r.s ? `${dots}${r.f===1?"한 번에":r.f+"번 만에"}` : r && r.a ? `${dots}${r.a}번 제출` : "–";
        return `<tr data-id="${p.id}" title="이 문제로 가기"><td class="n">${p.id.slice(1)}</td><td>${esc(p.title)}</td><td class="st ${st||"none"}">${label}</td><td class="tries">${tries}</td><td class="when">${r&&r.s?fmtDate(r.s):""}</td></tr>`;
      }).join("")}</tbody></table></div>`;
  }).join("");
  h += store.session
    ? `<p class="rec-foot">시도 횟수는 <b>제출하고 채점</b>을 누른 횟수예요. 실행 버튼은 세지 않아요. 기록은 학습 코드에 저장되어 선생님도 볼 수 있어요.</p>`
    : `<p class="rec-foot">지금은 코드 없이 연습 중이라 기록이 이 기기에만 남아요. <button class="linkish" onclick="closeRecord();openLogin()">학습 코드 넣기</button></p>`;
  $("#recBody").innerHTML = h;
}

else if (!store.guest) openLogin();
try { history.replaceState(null,"","#"+cur.id); } catch(e){}
